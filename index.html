<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Designs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .designs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            padding: 0 10px;
        }

        .design-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .design-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .design-card:hover h3,
        .design-card:hover p {
            color: white;
        }

        .design-card h3 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #333;
            transition: color 0.3s ease;
        }

        .design-card p {
            font-size: 0.95rem;
            color: #666;
            transition: color 0.3s ease;
            margin-bottom: 15px;
        }

        .design-card .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .design-card:hover .badge {
            background: white;
            color: #667eea;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .designs-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .design-card {
                padding: 20px;
            }

            .design-card h3 {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .designs-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.95rem;
            }

            .design-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Real Estate Designs</h1>
            <p>Explore our collection of modern designs</p>
        </div>

        <div class="designs-grid">
            <a href="design 1/index.html" target="_blank" class="design-card">
                <h3>Normal</h3>
                <p>Classic residential design</p>
                <span class="badge">View Design</span>
            </a>

            <a href="design 2/index.html" target="_blank" class="design-card">
                <h3>Medium</h3>
                <p>Contemporary style</p>
                <span class="badge">View Design</span>
            </a>

            <a href="design 3/index.html" target="_blank" class="design-card">
                <h3>Premium</h3>
                <p>Luxury collection</p>
                <span class="badge">View Design</span>
            </a>

            <a href="design 4/index.html" target="_blank" class="design-card">
                <h3>Other</h3>
                <p>Special showcase</p>
                <span class="badge">View Design</span>
            </a>
        </div>
    </div>
</body>
</html>
